<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Subtitles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 標題 -->
    <div class="header">
      <h1>🎬 Stream Subtitles</h1>
      <p class="subtitle">即時字幕產生器</p>
    </div>

    <!-- 狀態顯示 -->
    <div class="status-section">
      <div class="status-indicator" id="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">未啟動</span>
      </div>
    </div>

    <!-- 語言選擇 -->
    <div class="language-section">
      <h3>選擇語言</h3>
      <div class="language-buttons">
        <button class="lang-btn active" data-lang="en">
          <span class="flag">🇬🇧</span>
          <span class="lang-name">English</span>
        </button>
        <button class="lang-btn" data-lang="ja">
          <span class="flag">🇯🇵</span>
          <span class="lang-name">日本語</span>
        </button>
        <button class="lang-btn" data-lang="zh-TW">
          <span class="flag">🇹🇼</span>
          <span class="lang-name">繁體中文</span>
        </button>
        <button class="lang-btn auto-btn" data-lang="auto">
          <span class="flag">🌐</span>
          <span class="lang-name">自動偵測</span>
        </button>
      </div>
    </div>

    <!-- 控制按鈕 -->
    <div class="control-section">
      <button id="start-btn" class="primary-btn">
        <span class="btn-icon">▶️</span>
        <span class="btn-text">開始錄音</span>
      </button>
      <button id="stop-btn" class="secondary-btn" disabled>
        <span class="btn-icon">⏹️</span>
        <span class="btn-text">停止錄音</span>
      </button>
    </div>

    <!-- 修正歷史和 Keywords -->
    <div class="corrections-section">
      <h3>📚 學習記錄</h3>
      <div id="corrections-list" class="corrections-list">
        <div class="empty-state">
          <p>還沒有修正記錄</p>
          <p class="small">點擊字幕旁的 ✏️ 按鈕來修正錯誤</p>
        </div>
      </div>
      <div class="corrections-actions">
        <button id="clear-corrections-btn" class="small-btn">🗑️ 清除全部</button>
      </div>
    </div>

    <!-- 快捷鍵提示 -->
    <div class="shortcuts-section collapsed">
      <h3 class="collapsible-header">⌨️ 鍵盤快捷鍵 <span class="toggle-icon">▼</span></h3>
      <div class="shortcut-list">
        <div class="shortcut-item">
          <kbd>Alt + 1</kbd>
          <span>切換到英文</span>
        </div>
        <div class="shortcut-item">
          <kbd>Alt + 2</kbd>
          <span>切換到日文</span>
        </div>
        <div class="shortcut-item">
          <kbd>Alt + 3</kbd>
          <span>切換到中文</span>
        </div>
        <div class="shortcut-item">
          <kbd>Alt + 4</kbd>
          <span>自動偵測</span>
        </div>
        <div class="shortcut-item">
          <kbd>Alt + S</kbd>
          <span>開始/停止</span>
        </div>
      </div>
    </div>

    <!-- API 設定區域 -->
    <div class="api-section">
      <h3>🔑 API 設定</h3>

      <!-- 未設定時顯示 -->
      <div id="api-setup" class="api-setup">
        <p class="info-text">需要 Deepgram API key 才能使用字幕功能</p>
        <div class="api-input-group">
          <input
            type="password"
            id="api-key-input"
            placeholder="貼上你的 Deepgram API key"
            class="api-input"
          >
          <button id="save-api-key-btn" class="save-btn">💾 儲存</button>
        </div>
        <div class="api-help">
          <a href="https://console.deepgram.com/signup" target="_blank" class="help-link">
            🎁 取得免費 API Key（$200 額度）
          </a>
        </div>
      </div>

      <!-- 已設定時顯示 -->
      <div id="api-status" class="api-status hidden">
        <div class="api-key-display">
          <span class="key-icon">✅</span>
          <span id="api-key-masked" class="key-masked">sk-****...****</span>
          <button id="edit-api-key-btn" class="icon-btn" title="修改">✏️</button>
          <button id="delete-api-key-btn" class="icon-btn" title="刪除">🗑️</button>
        </div>
        <p class="small success-text">API key 已設定</p>
      </div>
    </div>

    <!-- 版本資訊 -->
    <div class="footer">
      <p>Version 1.0.0</p>
      <p class="small">支援英文、日文、繁體中文</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
